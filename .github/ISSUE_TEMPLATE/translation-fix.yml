name: Translation fix
description: A translation is wrong, awkward or missing. You do not need to edit any files.
title: "[Translation] "
labels: ["translation"]
body:
  - type: input
    id: language
    attributes:
      label: Language
      description: The language name or code, for example Spanish (es).
    validations:
      required: true
  - type: input
    id: key
    attributes:
      label: Key or place on the website
      description: The key from the JSON file if you know it (for example home.hero.title), or the page and the sentence where you saw the problem.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested text
      description: Keep any {{placeholders}} exactly as they are.
    validations:
      required: true
  - type: dropdown
    id: speaker
    attributes:
      label: How well do you know this language?
      options:
        - Native speaker
        - Fluent
        - Learner
    validations:
      required: true
